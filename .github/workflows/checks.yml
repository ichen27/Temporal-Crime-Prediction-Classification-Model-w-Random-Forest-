name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m syracuse_model.download
      - run: syracuse-model train --database work/crime_data.db --output work/benchmark
      - run: syracuse-model predict --model work/benchmark/model.joblib --date 2023-07-15
