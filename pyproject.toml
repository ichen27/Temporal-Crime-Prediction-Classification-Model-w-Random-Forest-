[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syracuse-temporal-model"
version = "0.3.0"
description = "Retrospective Syracuse crime-record count forecasting and classification experiments"
requires-python = ">=3.11"
dependencies = ["syracuse-crime-analysis @ git+https://github.com/ichen27/Syracuse-Crime-Data-Analysis.git@1c628ed648bf475efd8758652f781e69b048d47c", "scikit-learn>=1.7,<1.10", "joblib>=1.4,<2", "threadpoolctl>=3,<4", "statsmodels>=0.14,<0.15"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
syracuse-model = "syracuse_model.cli:main"
syracuse-forecast = "syracuse_model.forecast_cli:main"
syracuse-smooth = "syracuse_model.smoothing_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
